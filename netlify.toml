# Netlify configuration for joshmarr.com
# This is a static site with no build step — Netlify just publishes the repo root.

[build]
  publish = "."
  command = ""

# Serverless functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Lunch menu calendar feed.
# MUST stay above the catch-all 404 rule below — redirects are evaluated
# top-down, and the catch-all would otherwise swallow this path.
[[redirects]]
  from = "/lunch.ics"
  to = "/.netlify/functions/lunch"
  status = 200
  force = true

# Send any unknown path to the custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
